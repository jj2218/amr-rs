[package]
name = "amr-fuzz"
version = "0.0.0"
description = "cargo-fuzz targets (nightly, `just fuzz` only; not part of the stable workspace)"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
amr-nb = { path = "../../crates/amr-nb" }
ref26073-sys = { path = "../../crates/ref26073-sys" }
amr-wb = { path = "../../crates/amr-wb" }
ref26173-sys = { path = "../../crates/ref26173-sys" }

# Its own workspace: kept out of the stable one (`just check`, CI).
[workspace]

[[bin]]
name = "nb_rfc4867"
path = "fuzz_targets/nb_rfc4867.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nb_decode_vs_ref"
path = "fuzz_targets/nb_decode_vs_ref.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nb_encode_vs_ref"
path = "fuzz_targets/nb_encode_vs_ref.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wb_decode_vs_ref"
path = "fuzz_targets/wb_decode_vs_ref.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wb_rfc4867"
path = "fuzz_targets/wb_rfc4867.rs"
test = false
doc = false
