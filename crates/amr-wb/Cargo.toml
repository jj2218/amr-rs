[package]
name = "amr-wb"
version = "0.2.0"
description = "Pure-Rust, bit-exact AMR-WB (3GPP TS 26.173, ITU-T G.722.2) speech decoder and encoder"
keywords = ["amr-wb", "speech", "codec", "audio", "3gpp"]
categories = ["multimedia::audio", "multimedia::encoding", "encoding"]
readme = "README.md"
# The tests and benches need the C oracles and vectors (dev-only path crates): not packaged.
exclude = ["tests/", "benches/"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dev-dependencies]
opencore-sys = { path = "../opencore-sys", features = ["wb", "wbenc"] }
ref26173-sys = { path = "../ref26173-sys" }

[[bench]]
name = "codec"
harness = false
