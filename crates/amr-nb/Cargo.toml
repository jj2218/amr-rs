[package]
name = "amr-nb"
version = "0.1.1"
description = "Pure-Rust, bit-exact AMR-NB (3GPP TS 26.073) speech codec: encoder, decoder, DTX, RFC 4867 packing"
keywords = ["amr", "speech", "codec", "audio", "3gpp"]
categories = ["multimedia::audio", "multimedia::encoding", "encoding"]
readme = "README.md"
# The tests and benches need the C oracles and vectors (dev-only path crates): not packaged.
exclude = ["tests/", "benches/"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dev-dependencies]
opencore-sys = { path = "../opencore-sys", features = ["nb"] }
ref26073-sys = { path = "../ref26073-sys" }

[[bench]]
name = "codec"
harness = false
