[package]
name = "ref26073-sys"
version = "0.0.0"
description = "Test oracle only: the 3GPP TS 26.073 AMR-NB reference C code, compiled from the pinned download in .cache/3gpp (never committed); every symbol prefixed `ref_`"
publish = false
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true

[build-dependencies]
cc = "1"

# FFI to C: deliberately without the workspace lints (unsafe_code = "deny"); the empty table
# says so and silences cargo's missing-lints-inheritance warning.
[lints]
