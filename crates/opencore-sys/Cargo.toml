[package]
name = "opencore-sys"
version = "0.0.0"
description = "Test/bench oracle only: opencore-amr 0.1.6 and vo-amrwbenc 0.1.3 (Apache-2.0) compiled from the pinned tarballs in .cache/opencore"
publish = false
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true

[features]
# One library per codec: `nb` (AMR-NB codec), `wb` (AMR-WB decoder), `wbenc` (AMR-WB encoder,
# vo-amrwbenc).
nb = []
wb = []
wbenc = []
# Fuzzing oracle: pin opencore's known undefined behaviour (RESULTS.md defects 3 and 4) to the
# defined behaviour the Rust port implements (zeroed locals, wrapping signed arithmetic).
pin-ub = []

[build-dependencies]
cc = "1"

# FFI to C: deliberately without the workspace lints (unsafe_code = "deny"); the empty table
# says so and silences cargo's missing-lints-inheritance warning.
[lints]
