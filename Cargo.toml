[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
# The oldest Rust that builds amr-nb (let-chains, `as_chunks`), checked by `just msrv`.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/jj2218/amr-rs"

[workspace.lints.rust]
# Safe by default. Only the AVX2 dispatch (amr-nb src/simd.rs) and cfg(test) C oracles opt in.
unsafe_code = "deny"
missing_docs = "warn"
# `--cfg amr_nb_portable` compiles out the AVX2 dispatch (crates/amr-nb/src/simd.rs);
# `--cfg amr_nb_arrays` runs the SSE2 kernels' array forms (the non-x86 bodies) on x86; `just test`.
# `--cfg amr_nb_stages`: encoder stage timers (`BENCH=stages just bench`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(amr_nb_portable)", "cfg(amr_nb_arrays)", "cfg(amr_nb_stages)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Tests run optimised: the debug passes ran the conformance vectors at -O0 (~6.5 min each).
# Overflow checks and debug assertions stay on (they are separate settings).
[profile.dev]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "fat"

[profile.bench]
inherits = "release"
debug = true
